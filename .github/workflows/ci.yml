name: CI

on:
  pull_request:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  verify:
    name: Tokens, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      TIENDLY_ENTORNO: preview
      TIENDLY_TIENDA_DEMO: muna
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Instalar dependencias del lockfile
        run: |
          if [ -f ../package-lock.json ]; then
            npm ci --prefix ..
          else
            npm ci
          fi
      - name: Verificar configuración de entornos
        run: npm run test:environments
      - name: Verificar tokens
        run: npm run check:tokens
      - name: Compilar Next.js
        run: npm run build
      - name: Verificar tipos del frontend
        run: npm run typecheck
      - name: Verificar backend cuando exista
        run: |
          if [ -f ../backend/package.json ]; then
            npm --prefix ../backend run typecheck --if-present
            npm --prefix ../backend run test --if-present
          fi
      - name: Compilar Cloudflare cuando exista
        run: |
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts["build:vinext"] ? 0 : 1)'; then
            npm run build:vinext
            npm run typecheck
            npm run prepare:wrangler-preview --if-present
          fi

      - name: Guardar artefacto QA del commit validado
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: qa-worker-${{ github.sha }}
          path: frontend/.wrangler/preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-qa:
    name: Publicar QA
    needs: verify
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && vars.QA_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-qa
      cancel-in-progress: false
    environment:
      name: qa
      url: https://preview.tiendly.workers.dev
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Instalar herramientas del lockfile
        run: npm ci --prefix ..
      - uses: actions/download-artifact@v4
        with:
          name: qa-worker-${{ github.sha }}
          path: frontend/.wrangler/preview/
      - name: Verificar destino y credencial de QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_QA_API_TOKEN en el entorno GitHub qa."; exit 1; }
          node --test scripts/wrangler-preview.test.mjs
          node scripts/assert-qa-release.mjs
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA" || { echo "dev ya cambió; no publicar un commit anterior."; exit 1; }
      - name: Publicar solo el Worker de QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 59f2586c7dd8a0467d1f9e444129e03a
        run: npx --no-install wrangler deploy --config .wrangler/preview/wrangler.json --message "dev $GITHUB_SHA"
      - name: Comprobar salud, commit y rutas públicas
        run: npm run verify:qa
      - name: Resumen de publicación
        if: always()
        run: |
          echo "QA: https://preview.tiendly.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit validado: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado: ${{ job.status }}. No se ejecutan migraciones ni cambios productivos." >> "$GITHUB_STEP_SUMMARY"
