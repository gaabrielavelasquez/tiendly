name: CI

on:
  pull_request:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tokens, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      TIENDLY_ENTORNO: preview
      TIENDLY_TIENDA_DEMO: muna
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Instalar dependencias del lockfile
        run: |
          if [ -f ../package-lock.json ]; then
            npm ci --prefix ..
          else
            npm ci
          fi
      - name: Verificar tokens
        run: npm run check:tokens
      - name: Compilar Next.js
        run: npm run build
      - name: Verificar tipos del frontend
        run: npm run typecheck
      - name: Verificar backend cuando exista
        run: |
          if [ -f ../backend/package.json ]; then
            npm --prefix ../backend run typecheck --if-present
            npm --prefix ../backend run test --if-present
          fi
      - name: Compilar Cloudflare cuando exista
        run: |
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts["build:vinext"] ? 0 : 1)'; then
            npm run build:vinext
            npm run typecheck
          fi
